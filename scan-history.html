<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan History</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-secondary-subtle">
    <div class="container">
      <br />
      <h1 class="text-center">📈 Scan History</h1>
      <div class="mb-3 text-center">
        <a href="index.html" class="btn btn-outline-primary">Back to Tuner</a>
      </div>
      <div id="history-chart" style="height: 400px; width: 100%;"></div>
      <div class="mt-4">
        <label for="freq-input" class="form-label">Scan Frequency (minutes)</label>
        <div class="input-group">
          <input type="number" id="freq-input" class="form-control" min="1" />
          <button id="save-schedule" class="btn btn-primary">Update</button>
        </div>
      </div>
      <br />
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="history.js"></script>
  </body>
</html>
